<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멘토-멘티 매칭 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <nav id="navbar" class="glass-nav">
        <div class="logo">Mentor Connect</div>
        <div class="nav-links">
            <button onclick="switchScreen('login')" class="active" id="btn-login">1. 로그인</button>
            <button onclick="switchScreen('profile')" id="btn-profile">2. 가입/프로필</button>
            <button onclick="switchScreen('matching')" id="btn-matching" style="display:none;">3. 매칭 현황</button>
            <button onclick="switchScreen('mission')" id="btn-mission" style="display:none;">4. 미션 보드</button>
            <button onclick="switchScreen('score')" id="btn-score">5. 리더보드</button>
        </div>
    </nav>

    <div class="container glass-container">
        <!-- 1. 로그인 창 -->
        <div id="login" class="screen active fade-in">
            <h2>로그인</h2>
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="login-username" placeholder="아이디 입력">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="login-password" placeholder="비밀번호 입력">
            </div>
            <button class="btn-submit" onclick="login()">로그인 실행</button>
            <p id="login-msg" class="msg"></p>
        </div>

        <!-- 2. 프로필 입력 창 -->
        <div id="profile" class="screen fade-in">
            <h2>프로필 입력 (회원가입)</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="reg-id" placeholder="ID">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="reg-pwd">
                </div>
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="reg-name">
                </div>
                <div class="form-group">
                    <label>성별</label>
                    <select id="reg-gender"><option value="M">남성</option><option value="F">여성</option></select>
                </div>
                <div class="form-group">
                    <label>나이</label>
                    <input type="number" id="reg-age" value="20">
                </div>
                <div class="form-group">
                    <label>MBTI</label>
                    <input type="text" id="reg-mbti" placeholder="예: INTP">
                </div>
                <div class="form-group">
                    <label>주거 형태</label>
                    <select id="reg-living"><option value="자취">자취</option><option value="통학">통학</option><option value="기숙사">기숙사</option></select>
                </div>
                <div class="form-group">
                    <label>학적 상태 (역할)</label>
                    <select id="reg-role"><option value="false">신입생 (멘티)</option><option value="true">재학생 (멘토)</option></select>
                </div>
                <div class="form-group span-2">
                    <label>휴대폰 번호</label>
                    <input type="text" id="reg-phone" placeholder="010-0000-0000">
                </div>
                <div class="form-group span-2">
                    <label>취미 (단어 키워드 중심)</label>
                    <input type="text" id="reg-hobbies" placeholder="예: 독서, 게임, 자전거">
                </div>
            </div>
            <button class="btn-submit" onclick="register()">프로필 저장 후 가입</button>
            <p id="reg-msg" class="msg"></p>
        </div>

        <!-- 3. 매칭 창 -->
        <div id="matching" class="screen fade-in">
            <h2>매칭 결과</h2>
            <div class="actions">
                <button class="btn-secondary" onclick="triggerMatching()" id="btn-admin-match">서버 매칭 알고리즘 실행 (관리자용)</button>
                <button class="btn-secondary" onclick="fetchMyMatch()">내 매칭 정보 새로고침</button>
            </div>
            <div class="card glass-card" id="match-info">
                <h3>내 파트너 정보</h3>
                <p>아직 매칭 정보를 불러오지 않았거나, 매칭되지 않았습니다.</p>
            </div>
        </div>

        <!-- 4. 미션 창 -->
        <div id="mission" class="screen fade-in">
            <h2>진행중인 미션 보드</h2>
            <div class="actions">
                <button class="btn-secondary" onclick="fetchMissions()">우리 팀 미션 새로고침</button>
            </div>
            <div id="mission-list">
                <!-- Missions will be injected here -->
            </div>
            <div class="card glass-card" id="assign-mission-admin" style="margin-top:20px; border: 1px dashed #a855f7; display:none;">
                <h3>새로운 미션 할당 (관리자용 Mock)</h3>
                <input type="number" id="mission-match-id" placeholder="매칭 ID (위의 내 매칭정보에서 확인)" style="margin-bottom:10px;">
                <input type="text" id="mission-title" placeholder="미션 제목" style="margin-bottom:10px;">
                <input type="text" id="mission-desc" placeholder="내용" style="margin-bottom:10px;">
                <button class="btn-submit" onclick="adminAssignMission()">팀에 미션 부여하기</button>
                <p id="mission-assign-msg" class="msg"></p>
            </div>
        </div>

        <!-- 5. 점수 확인 창 -->
        <div id="score" class="screen fade-in">
            <h2>점수 확인 (리더보드)</h2>
            <div class="actions">
                <button class="btn-secondary" onclick="fetchLeaderboard()">리더보드 업데이트</button>
            </div>
            <table class="glass-table">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>멘토-멘티 팀</th>
                        <th>완료 누적 미션 수</th>
                        <th>누적 점수</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
